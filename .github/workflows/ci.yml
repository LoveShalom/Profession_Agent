name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# CI 门（F-01 §4.1 → F-09 §2.2）：
#   1) 适配层纯净度（AC-13 / 红线③）—— 零依赖，必跑
#   2) 核心单测（node:test，零依赖）—— 必跑
#   3) doctor --no-network —— 必跑（配置与安全策略自检）
#   4) lint / typecheck / 评测 / 敏感扫描 —— 需要 npm install，在 full job 跑
#
# 设计原则（F-09 §2.3）：**CI 必须离线可复现**，不依赖 LLM Key / Docker / 真实数据库。
# 评测走 rules 模式（确定性）；replay fixtures 由作者本地录制。
jobs:
  core:
    name: 核心检查（零依赖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 适配层纯净度（业务代码零厂商 SDK）
        run: node scripts/check-adapter-purity.mjs

      - name: 核心单元测试
        run: node scripts/run-tests.mjs

      - name: doctor（离线模式）
        run: node scripts/doctor.mjs --no-network || true

  full:
    name: 全量检查（lint / typecheck / 评测）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试（不连数据库）
        run: npm test

      - name: 评测集 lock 校验（防止偷改评测集）
        run: node scripts/gen-eval-dataset.mjs --check

      - name: 抽取质量评测（rules 模式，离线确定性）
        run: npm run eval

      - name: 敏感文件二次扫描（防泄露双保险）
        run: node scripts/check-sensitive.mjs --all

      # 说明：CI 里不跑 `next build` —— 本地优先应用，构建验证由作者本地做（README 有说明）；
      # 也不跑任何需要 LLM Key / Docker 的步骤：CI 离线可复现是硬约束。
